table:
  name: buildings
  schema: public
object_relationships:
  - name: organization
    using:
      foreign_key_constraint_on: organization_id
array_relationships:
  - name: announcements
    using:
      foreign_key_constraint_on:
        column: building_id
        table:
          name: announcements
          schema: public
  - name: devices
    using:
      foreign_key_constraint_on:
        column: building_id
        table:
          name: devices
          schema: public
  - name: notifications
    using:
      foreign_key_constraint_on:
        column: building_id
        table:
          name: notifications
          schema: public
  - name: units
    using:
      foreign_key_constraint_on:
        column: building_id
        table:
          name: units
          schema: public
