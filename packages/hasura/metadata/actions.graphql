type Query {
  requestSmsVerifCode(
    requestSmsVerifCodeData: RequestSmsVerifCodeInput!
  ): RequestSmsVerifCodeOutput!
}

type Mutation {
  userSignIn(
    signInData: UserSignInInput!
  ): UserSignInOutput!
}

type Mutation {
  userSignUp(
    signUpData: UserSignUpInput!
  ): UserSignUpOutput!
}

input RequestSmsVerifCodeInput {
  phone: String!
}

input UserSignInInput {
  phone: String!
  verificationCode: String!
}

input UserSignUpInput {
  unitId: uuid!
  name: String!
  phone: String!
  verificationCode: String!
  email: String
}

type RequestSmsVerifCodeOutput {
  verificationStatus: String!
}

type UserSignInOutput {
  userId: String!
  accessToken: String!
}

type UserSignUpOutput {
  accessToken: String!
  userId: uuid!
}

